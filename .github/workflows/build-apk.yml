name: Build & Release Signed Android VPN APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Download official sing-box libbox.aar (if not committed in app/libs)
        run: |
          mkdir -p app/libs
          if [ ! -f "app/libs/libbox.aar" ]; then
            echo "Checking latest sing-box Android libbox.aar archive..."
            if ! curl -fsSL --retry 3 \
              "https://github.com/SagerNet/sing-box/releases/latest/download/libbox.aar" \
              -o app/libs/libbox.aar; then
              rm -f app/libs/libbox.aar
              echo "libbox.aar not directly attached in latest release; using built-in LibboxBridge."
            fi
          fi

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease \
              -keypass androidrelease \
              -dname "CN=AegisBoxVPN, OU=Mobile, O=AegisBox, L=Moscow, S=RU, C=RU"
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'androidrelease' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease' }}
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/AegisBox-VPN-v2.6.0-RU-release.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisBox-VPN-v2.6.0-RU-release
          path: release-assets/AegisBox-VPN-v2.6.0-RU-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0-ru
          name: "AegisBox VPN v2.6.0-RU"
          body: |
            ### AegisBox VPN (sing-box + VLESS Reality + Cloudflare WARP)
            - **Google Gemini / AI Studio:** каскадная цепочка `VLESS Reality -> Cloudflare WARP Detour`
            - **YouTube 4K & Telegram:** авто-балансировщик `urltest` (180с, `gstatic.com/generate_204`)
            - **РФ-сервисы напрямую:** Per-App Whitelist + прямой DNS `77.88.8.8` для `.ru` / `.рф` / банков / Госуслуг
            - **Защита от утечек:** TUN `172.19.0.1/30`, строго `ipv4_only`, `FakeIP 198.18.0.0/15` + DoH `1.1.1.1`
            - **Платформа:** Android 8.0+ (`minSdk 26`), `arm64-v8a`, поддержка `16 KB page size`

            Скачайте файл **`AegisBox-VPN-v2.6.0-RU-release.apk`** ниже и установите на Android-устройство.
          make_latest: true
          files: release-assets/AegisBox-VPN-v2.6.0-RU-release.apk
