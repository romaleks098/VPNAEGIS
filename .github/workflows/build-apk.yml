name: Build & Release Signed Android VPN APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify libbox Maven dependency or fallback AAR
        run: |
          if grep -q "libbox" app/build.gradle.kts; then
            echo "Using Maven libbox dependency declared in app/build.gradle.kts (skipping manual AAR download)."
            rm -f app/libs/libbox.aar
          elif [ ! -f "app/libs/libbox.aar" ]; then
            mkdir -p app/libs
            curl -fsSL --retry 3 \
              "https://github.com/SagerNet/sing-box/releases/latest/download/libbox.aar" \
              -o app/libs/libbox.aar || rm -f app/libs/libbox.aar
          fi

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease \
              -keypass androidrelease \
              -dname "CN=AegisBoxVPN, OU=Mobile, O=AegisBox, L=Moscow, S=RU, C=RU"
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'androidrelease' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease' }}
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/AegisBox-VPN-v3.0.0-LiquidGlass-release.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisBox-VPN-v3.0.0-LiquidGlass-release
          path: release-assets/AegisBox-VPN-v3.0.0-LiquidGlass-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-liquid-glass
          name: "AegisBox VPN v3.0.0 — Liquid Glass & sing-box Core"
          body: |
            ### AegisBox VPN v3.0.0 (Liquid Glass + real `libbox` / `sing-box` 1.12+)
            - **Настоящее ядро `libbox` (`net.clever-vpn:libbox-android:2.1.5`):** полный `PlatformInterface`, `CommandServer` и `CommandClient` с живой скоростью, логами и `urlTest`.
            - **Google Gemini без ограничений:** каскад `VLESS Reality -> Cloudflare WARP` (секция `endpoints`, реальный X25519 WARP API, блокировка утечного QUIC UDP/443).
            - **Белый список без ошибок:** только `addAllowedApplication()` + опция «Системные зависимости (GMS / WebView)».
            - **Редизайн Liquid Glass:** живой фон `FluidMeshBackground`, реальный блюр `Haze`, Hero-сфера и парящий стеклянный док-бар.

            Скачайте **`AegisBox-VPN-v3.0.0-LiquidGlass-release.apk`** ниже и установите на Android 8.0+ (`arm64-v8a` / `16 KB page size`).
          make_latest: true
          files: release-assets/AegisBox-VPN-v3.0.0-LiquidGlass-release.apk
